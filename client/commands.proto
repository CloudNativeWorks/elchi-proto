syntax = "proto3";

package client;

option go_package = "github.com/CloudNativeWorks/elchi-proto/client";

// CommandType defines all possible command types
enum CommandType {
  UNKNOWN = 0;

  // DEPLOY
  DEPLOY = 1;
  UNDEPLOY = 2;

  // BOOTSTRAP
  UPDATE_BOOTSTRAP = 11;
  UPGRADE_LISTENER = 12;

  // SERVICES
  SERVICE = 21;

  // CLIENT
  CLIENT_LOGS = 31;
  CLIENT_STATS = 32;

  // PROXY
  PROXY = 41;

  // NETWORK
  NETWORK = 51;

  // FRR
  FRR = 61;
  FRR_LOGS = 62;

  // ENVOY
  ENVOY_VERSION = 71;

  WAF_VERSION = 81;

  FILEBEAT = 82;

  RSYSLOG = 83;

  // SHIELD — elchi-shield ext_proc API-security/WAF config delivery
  SHIELD = 84;

  // AI_GATEWAY — elchi-ai-gateway (LLM gateway ext_proc supervisor) config delivery
  AI_GATEWAY = 85;

  // APPLIANCE — the appliance OS itself (Elchi OS 0.5.0+): status, exports,
  // compliance. The 90s are the appliance-OS group.
  APPLIANCE = 91;
}
