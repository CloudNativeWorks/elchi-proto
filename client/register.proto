syntax = "proto3";

package client;

option go_package = "github.com/CloudNativeWorks/elchi-proto/client";

import "client/identity.proto";

// RegisterRequest contains client registration information
message RegisterRequest {
    string client_id = 1;
    string token = 2;
    string name = 3;
    string version = 4;
    string hostname = 5;
    string os = 6;
    string arch = 7;
    string kernel = 8;
    // Free-form facts about the host. Keys the control plane reads:
    //   network_managed_by — "os" (the appliance console owns interfaces;
    //                        Elchi OS 0.5.0+) or "agent" (this agent edits netplan)
    //   os_id              — os-release ID ("elchi", "ubuntu", …)
    //   ha_addrs           — JSON {"data":[{iface,addr,prefix,mac}],"mgmt":[…]}:
    //                        IPv4 addresses an HA pair's heartbeat can use
    //   ha_daemon_version  — the elchi-ha daemon's version ("" = none)
    //   ha_mode            — "true": installed as an HA appliance; the control
    //                        plane makes it a one-member pair on first registration
    map<string, string> metadata = 9;
    string project_id = 10; // Optional: Project ID for the client. If empty, default project will be used
    bool bgp = 11;          // BGP routing capability
    string provider = 12;   // Infrastructure provider (openstack, other)
    string cloud = 13;
}

// RegisterResponse contains the server's response to registration
message RegisterResponse {
    bool success = 1;
    string error = 2;
    string session_token = 3;
}

// UnregisterRequest contains information for client unregistration
message UnregisterRequest {
    Identity identity = 1;
}

// UnregisterResponse contains the server's response to unregistration
message UnregisterResponse {
    bool success = 1;
    string error = 2;
}